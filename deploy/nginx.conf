# 营销平台前端 Nginx 配置（容器内 /etc/nginx/conf.d/default.conf）
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存：前端发版后必须立刻生效，否则浏览器会继续跑旧版本（入口/新页面看不到）
    # 产物 JS/CSS 带内容哈希，仍由下方 /assets/ 长缓存
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        etag off;
        if_modified_since off;
    }

    # 同域反向代理到后端容器（software_my-network 内容器名，无需安全组暴露 8091）
    location ^~ /api/v1/raffle/admin/ {
        deny all;
    }

    location ^~ /api/v1/raffle/dcc/ {
        deny all;
    }

    location /api/ {
        proxy_pass http://marketing-platform:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Vite 产物带内容哈希，可长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
