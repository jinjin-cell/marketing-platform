# 前端部署（云服务器 111.228.17.153）
# 目录结构：../dist 为 vite 构建产物，./nginx.conf 为站点配置
# 命令：docker compose -f docker-compose-web.yml up -d
# 说明：加入中间件网络 software_my-network，/api 经 nginx 反代到后端容器 marketing-platform:8091
services:
  marketing-platform-web:
    image: nginx:1.27-alpine
    container_name: marketing-platform-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - middleware
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  middleware:
    name: software_my-network
    external: true
