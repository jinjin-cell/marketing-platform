server:
  port: 8091
  tomcat:
    threads:
      max: 200   # 最大线程数
      min-spare: 50   # 最小空闲线程数
    accept-count: 10   # 接受连接数
# 应用配置
app:
  config:
    # 版本，方便通过接口版本升级
    api-version: v1
    # 跨域，开发阶段可以设置为 * 不限制
    cross-origin: "*"

activity:

  order:
    bloom-filter:
      expected-insertions: 1000000
      false-probability: 0.001

# 分库分表路由配置
db-router:
  db-count: 2
  # 每库分表数量，需与 spring.shardingsphere.sharding.tables.*.actual-data-nodes 的 _00$->{0..3} 保持一致
  table-count: 4

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# Sharding-JDBC 多数据源配置；ds0 为配置库，ds1、ds2 为用户行为分库
spring:
  config:
    import: classpath:sharding-tables.yml
  # 搜索与同步服务部署在 192.168.94.128；MySQL/Redis/MQ/Nacos 仍使用 111.228.17.153。
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://192.168.94.128:9200}
    username: ${ELASTICSEARCH_USERNAME:qijiv}
    password: ${ELASTICSEARCH_PASSWORD:123456}
  rabbitmq:
    addresses: 111.228.17.153:5672
    username: qijiv
    password: 18903705503qQ
    listener:
      simple:
        prefetch: 1
    topic:
      activity_sku_stock_zero: activity_sku_stock_zero
      send_award: send.award
      send_rebate: send.rebate
      credit_adjust_success: credit_adjust_success

  shardingsphere:
    datasource:
      names: ds0,ds1,ds2
      ds0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://111.228.17.153:13306/big_market?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&zeroDateTimeBehavior=convertToNull
        username: root
        password: 123456
        pool-name: Retail_HikariCP_DS0
        minimum-idle: 5
        maximum-pool-size: 10
      ds1:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://111.228.17.153:13306/big_market_01?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&zeroDateTimeBehavior=convertToNull
        username: root
        password: 123456
        pool-name: Retail_HikariCP_DS1
        minimum-idle: 5
        maximum-pool-size: 10
      ds2:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://111.228.17.153:13306/big_market_02?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&zeroDateTimeBehavior=convertToNull
        username: root
        password: 123456
        pool-name: Retail_HikariCP_DS2
        minimum-idle: 5
        maximum-pool-size: 10

redis:
  address: ${REDIS_ADDRESS:redis://111.228.17.153:16379}
  username: ${REDIS_USERNAME:qijiv}
  password: ${REDIS_PASSWORD:18903705503qQ}
  database: ${REDIS_DATABASE:0}
  connection-pool-size: ${REDIS_CONNECTION_POOL_SIZE:16}
  connection-minimum-idle-size: ${REDIS_CONNECTION_MINIMUM_IDLE_SIZE:2}
  connect-timeout: ${REDIS_CONNECT_TIMEOUT:30000}
  timeout: ${REDIS_TIMEOUT:10000}

dubbo:
  application:
    name: marketing-platform
    version: 1.0
  registry:
    id: nacos-registry
    address: nacos://${NACOS_HOST:111.228.17.153}:${NACOS_PORT:8848}
  protocol:
    name: dubbo
    port: ${DUBBO_PORT:20880}
  scan:
    base-packages: cn.qijiv.trigger.http

mybatis:
 mapper-locations: classpath:/mybatis/mapper/*.xml
 config-location:  classpath:/mybatis/config/mybatis-config.xml

zookeeper:
  sdk:
    config:
      connect-string: 111.228.17.153:2181
      base-sleep-time-ms: 1000
      max-retries: 5
      # sessionTimeout 必须大于 connectionTimeout，否则 Curator 会告警且会话易在连接期超时
      session-timeout-ms: 60000
      connection-timeout-ms: 30000


# 日志
logging:
  level:
    root: info
    # 降低 ShardingSphere 启动时打印分库分表配置与元数据加载的 INFO 日志，避免刷屏
    org.apache.shardingsphere: warn
    ShardingSphere-metadata: warn
  config: classpath:logback-spring.xml
