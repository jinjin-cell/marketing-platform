server:
  port: 8091
  tomcat:
    threads:
      max: 200
      min-spare: 50
    accept-count: 10

# 应用配置
app:
  config:
    api-version: v1
    cross-origin: ${APP_CROSS_ORIGIN:http://111.228.17.153}
    # 生产环境必须显式注入，不提供任何默认运维令牌。
    admin-token: ${ADMIN_TOKEN}
    jwt-secret: ${JWT_SECRET}
    jwt-expires-seconds: ${JWT_EXPIRES_SECONDS:604800}

activity:
  order:
    bloom-filter:
      expected-insertions: 1000000
      false-probability: 0.001

redis:
  address: ${REDIS_ADDRESS}
  username: ${REDIS_USERNAME}
  password: ${REDIS_PASSWORD}
  database: ${REDIS_DATABASE:0}
  connection-pool-size: ${REDIS_CONNECTION_POOL_SIZE:32}
  connection-minimum-idle-size: ${REDIS_CONNECTION_MINIMUM_IDLE_SIZE:8}
  connect-timeout: ${REDIS_CONNECT_TIMEOUT:30000}
  timeout: ${REDIS_TIMEOUT:10000}

# 分库分表路由配置
db-router:
  db-count: 2
  # 每库分表数量，需与 spring.shardingsphere.sharding.tables.*.actual-data-nodes 的 _00$->{0..3} 保持一致
  table-count: 4

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# Sharding-JDBC 多数据源配置；ds0 为配置库，ds1、ds2 为用户行为分库
# 连接信息通过环境变量注入（对齐 redis 的 ${REDIS_*} 写法），部署时必须设置
spring:
  cloud:
    zookeeper:
      connect-string: ${ZOOKEEPER_CONNECT_STRING:111.228.17.153:2181}
      discovery:
        # 项目不使用 Spring Cloud 服务发现（RPC 走 Dubbo+Nacos，动态配置走自研 Curator DCC）；
        # 开启时启动阶段会同步创建 ZK 节点，ZK 不可用将直接导致启动失败，故关闭
        enabled: false
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS}
    username: ${ELASTICSEARCH_USERNAME}
    password: ${ELASTICSEARCH_PASSWORD}
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        prefetch: 1
    topic:
      activity_sku_stock_zero: activity_sku_stock_zero
      send_award: send.award
      send_rebate: send.rebate
      credit_adjust_success: credit_adjust_success
  shardingsphere:
    datasource:
      names: ds0,ds1,ds2
      ds0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB_DS0}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&zeroDateTimeBehavior=convertToNull
        username: ${MYSQL_USERNAME}
        password: ${MYSQL_PASSWORD}
        pool-name: Retail_HikariCP_DS0
        minimum-idle: 5
        maximum-pool-size: 10
      ds1:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB_DS1}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&zeroDateTimeBehavior=convertToNull
        username: ${MYSQL_USERNAME}
        password: ${MYSQL_PASSWORD}
        pool-name: Retail_HikariCP_DS1
        minimum-idle: 5
        maximum-pool-size: 10
      ds2:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB_DS2}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&zeroDateTimeBehavior=convertToNull
        username: ${MYSQL_USERNAME}
        password: ${MYSQL_PASSWORD}
        pool-name: Retail_HikariCP_DS2
        minimum-idle: 5
        maximum-pool-size: 10
    sharding:
      default-data-source-name: ds0
      tables:
        raffle_activity_order:
          actual-data-nodes: ds$->{1..2}.raffle_activity_order_00$->{0..3}
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
          table-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
        raffle_activity_account:
          actual-data-nodes: ds$->{1..2}.raffle_activity_account
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
        raffle_activity_account_day:
          actual-data-nodes: ds$->{1..2}.raffle_activity_account_day
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
        raffle_activity_account_month:
          actual-data-nodes: ds$->{1..2}.raffle_activity_account_month
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
        task:
          actual-data-nodes: ds$->{1..2}.task
          database-strategy:
            hint:
              algorithm-class-name: cn.qijiv.infrastructure.db.TaskDBHintAlgorithm
        user_award_record:
          actual-data-nodes: ds$->{1..2}.user_award_record_00$->{0..3}
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
          table-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
        user_behavior_rebate_order:
          actual-data-nodes: ds$->{1..2}.user_behavior_rebate_order_00$->{0..3}
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
          table-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
        # 注意：以下两张表必须保留，否则会落到默认库 ds0（big_market）而该库无此表，
        # 积分查询/调整接口会直接抛 "Table 'big_market.user_credit_account' doesn't exist"，
        # 前端表现为“网络异常，请稍后重试”。修改时请与 sharding-tables.yml 保持一致。
        user_credit_account:
          actual-data-nodes: ds$->{1..2}.user_credit_account
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
        user_credit_order:
          actual-data-nodes: ds$->{1..2}.user_credit_order_00$->{0..3}
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
          table-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
        user_raffle_order:
          actual-data-nodes: ds$->{1..2}.user_raffle_order_00$->{0..3}
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
          table-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
    props:
      sql:
        show: false

mybatis:
  mapper-locations: classpath:/mybatis/mapper/mysql/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

dubbo:
  application:
    name: marketing-platform
    version: 1.0
  registry:
    id: nacos-registry
    address: nacos://${NACOS_HOST:111.228.17.153}:${NACOS_PORT:8848}
  protocol:
    name: dubbo
    port: ${DUBBO_PORT:20880}
  scan:
    base-packages: cn.qijiv.trigger.http

# XXL-JOB 分布式任务调度；生产环境通过环境变量注入（部署时必须设置）
xxl:
  job:
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES}
    accessToken: ${XXL_JOB_ACCESS_TOKEN}
    executor:
      appname: ${XXL_JOB_EXECUTOR_APPNAME:big-market-job}
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      logpath: ${XXL_JOB_EXECUTOR_LOGPATH:/data/applogs/xxl-job/jobhandler}
      logretentiondays: ${XXL_JOB_EXECUTOR_LOGRETENTIONDAYS:30}

# 自定义 Curator DCC 客户端配置。生产环境可通过环境变量覆盖连接串。
zookeeper:
  sdk:
    config:
      # 状态： true 开启，false 关闭；DCCValueBeanFactory 强依赖 zookeeperClient Bean，缺失会导致启动失败
      enable: true
      connect-string: ${ZOOKEEPER_CONNECT_STRING:111.228.17.153:2181}
      base-sleep-time-ms: ${ZOOKEEPER_BASE_SLEEP_TIME_MS:1000}
      max-retries: ${ZOOKEEPER_MAX_RETRIES:5}
      session-timeout-ms: ${ZOOKEEPER_SESSION_TIMEOUT_MS:60000}
      connection-timeout-ms: ${ZOOKEEPER_CONNECTION_TIMEOUT_MS:30000}

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml
