server:
  port: 8091
  tomcat:
    threads:
      max: 200
      min-spare: 50
    accept-count: 10

# 应用配置
app:
  config:
    api-version: v1
    cross-origin: "*"

activity:
  order:
    bloom-filter:
      expected-insertions: 1000000
      false-probability: 0.001

# 分库分表路由配置
db-router:
  db-count: 2
  # 每库分表数量，需与 spring.shardingsphere.sharding.tables.*.actual-data-nodes 的 _00$->{0..3} 保持一致
  table-count: 4

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# Sharding-JDBC 多数据源配置；ds0 为配置库，ds1、ds2 为用户行为分库
# 连接信息默认指向开发库，可通过环境变量覆盖
spring:
  rabbitmq:
    addresses: ${RABBITMQ_ADDRESSES:111.228.17.153:5672}
    username: ${RABBITMQ_USERNAME:qijiv}
    password: ${RABBITMQ_PASSWORD:18903705503qQ}
    listener:
      simple:
        prefetch: 1
    topic:
      activity_sku_stock_zero: activity_sku_stock_zero
      send_award: send_award
  shardingsphere:
    datasource:
      names: ds0,ds1,ds2
      ds0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://${MYSQL_HOST:111.228.17.153}:${MYSQL_PORT:13306}/${MYSQL_DB_DS0:big_market}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
        username: ${MYSQL_USERNAME:root}
        password: ${MYSQL_PASSWORD:123456}
        pool-name: Retail_HikariCP_DS0
        minimum-idle: 5
        maximum-pool-size: 10
      ds1:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://${MYSQL_HOST:111.228.17.153}:${MYSQL_PORT:13306}/${MYSQL_DB_DS1:big_market_01}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
        username: ${MYSQL_USERNAME:root}
        password: ${MYSQL_PASSWORD:123456}
        pool-name: Retail_HikariCP_DS1
        minimum-idle: 5
        maximum-pool-size: 10
      ds2:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://${MYSQL_HOST:111.228.17.153}:${MYSQL_PORT:13306}/${MYSQL_DB_DS2:big_market_02}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
        username: ${MYSQL_USERNAME:root}
        password: ${MYSQL_PASSWORD:123456}
        pool-name: Retail_HikariCP_DS2
        minimum-idle: 5
        maximum-pool-size: 10
    sharding:
      default-data-source-name: ds0
      tables:
        raffle_activity_order:
          actual-data-nodes: ds$->{1..2}.raffle_activity_order_00$->{0..3}
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.persistent.db.UserIdShardingAlgorithm
          table-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.persistent.db.UserIdShardingAlgorithm
        raffle_activity_account:
          actual-data-nodes: ds$->{1..2}.raffle_activity_account
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.persistent.db.UserIdShardingAlgorithm
        raffle_activity_account_day:
          actual-data-nodes: ds$->{1..2}.raffle_activity_account_day
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.persistent.db.UserIdShardingAlgorithm
        raffle_activity_account_month:
          actual-data-nodes: ds$->{1..2}.raffle_activity_account_month
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.persistent.db.UserIdShardingAlgorithm
        task:
          actual-data-nodes: ds$->{1..2}.task
          database-strategy:
            hint:
              algorithm-class-name: cn.qijiv.infrastructure.persistent.db.TaskDBHintAlgorithm
        user_award_record:
          actual-data-nodes: ds$->{1..2}.user_award_record_00$->{0..3}
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.persistent.db.UserIdShardingAlgorithm
          table-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.persistent.db.UserIdShardingAlgorithm
        user_raffle_order:
          actual-data-nodes: ds$->{1..2}.user_raffle_order_00$->{0..3}
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.persistent.db.UserIdShardingAlgorithm
          table-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.persistent.db.UserIdShardingAlgorithm
    props:
      sql:
        show: false

redis:
  address: ${REDIS_ADDRESS:redis://111.228.17.153:16379}
  username: ${REDIS_USERNAME:qijiv}
  password: ${REDIS_PASSWORD:18903705503qQ}
  database: ${REDIS_DATABASE:0}
  connection-pool-size: 32
  connection-minimum-idle-size: 8
  connect-timeout: 10000
  timeout: 3000

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml
