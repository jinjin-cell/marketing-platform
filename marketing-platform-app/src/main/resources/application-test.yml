server:
  port: 8091
  tomcat:
    threads:
      max: 200
      min-spare: 50
    accept-count: 10

# 应用配置
app:
  config:
    api-version: v1
    cross-origin: "*"
    # 运维接口（手动触发定时任务）令牌
    admin-token: ${TEST_ADMIN_TOKEN:test-only-admin-token}
    jwt-secret: ${TEST_JWT_SECRET:test-only-jwt-secret-at-least-32-chars}
    jwt-expires-seconds: 604800

activity:
  order:
    bloom-filter:
      expected-insertions: 1000000
      false-probability: 0.001

# 分库分表路由配置
db-router:
  db-count: 2
  # 每库分表数量，需与 spring.shardingsphere.sharding.tables.*.actual-data-nodes 的 _00$->{0..3} 保持一致
  table-count: 4

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

# Sharding-JDBC 多数据源配置；ds0 为配置库，ds1、ds2 为用户行为分库
# 连接信息默认指向开发库，可通过环境变量覆盖
spring:
  elasticsearch:
    uris: ${TEST_ELASTICSEARCH_URIS:http://127.0.0.1:1}
    username: ${TEST_ELASTICSEARCH_USERNAME:test}
    password: ${TEST_ELASTICSEARCH_PASSWORD:test}
  rabbitmq:
    addresses: ${TEST_RABBITMQ_ADDRESSES:127.0.0.1:1}
    username: ${TEST_RABBITMQ_USERNAME:test}
    password: ${TEST_RABBITMQ_PASSWORD:test}
    listener:
      simple:
        prefetch: 1
    topic:
      activity_sku_stock_zero: activity_sku_stock_zero
      send_award: send.award
      send_rebate: send.rebate
  shardingsphere:
    datasource:
      names: ds0,ds1,ds2
      ds0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://${TEST_MYSQL_HOST:127.0.0.1}:${TEST_MYSQL_PORT:1}/${TEST_MYSQL_DB_DS0:test_big_market}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&zeroDateTimeBehavior=convertToNull
        username: ${TEST_MYSQL_USERNAME:test}
        password: ${TEST_MYSQL_PASSWORD:test}
        pool-name: Retail_HikariCP_DS0
        minimum-idle: 5
        maximum-pool-size: 10
      ds1:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://${TEST_MYSQL_HOST:127.0.0.1}:${TEST_MYSQL_PORT:1}/${TEST_MYSQL_DB_DS1:test_big_market_01}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&zeroDateTimeBehavior=convertToNull
        username: ${TEST_MYSQL_USERNAME:test}
        password: ${TEST_MYSQL_PASSWORD:test}
        pool-name: Retail_HikariCP_DS1
        minimum-idle: 5
        maximum-pool-size: 10
      ds2:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://${TEST_MYSQL_HOST:127.0.0.1}:${TEST_MYSQL_PORT:1}/${TEST_MYSQL_DB_DS2:test_big_market_02}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&zeroDateTimeBehavior=convertToNull
        username: ${TEST_MYSQL_USERNAME:test}
        password: ${TEST_MYSQL_PASSWORD:test}
        pool-name: Retail_HikariCP_DS2
        minimum-idle: 5
        maximum-pool-size: 10
    sharding:
      default-data-source-name: ds0
      tables:
        raffle_activity_order:
          actual-data-nodes: ds$->{1..2}.raffle_activity_order_00$->{0..3}
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
          table-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
        raffle_activity_account:
          actual-data-nodes: ds$->{1..2}.raffle_activity_account
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
        raffle_activity_account_day:
          actual-data-nodes: ds$->{1..2}.raffle_activity_account_day
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
        raffle_activity_account_month:
          actual-data-nodes: ds$->{1..2}.raffle_activity_account_month
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
        task:
          actual-data-nodes: ds$->{1..2}.task
          database-strategy:
            hint:
              algorithm-class-name: cn.qijiv.infrastructure.db.TaskDBHintAlgorithm
        user_award_record:
          actual-data-nodes: ds$->{1..2}.user_award_record_00$->{0..3}
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
          table-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
        user_behavior_rebate_order:
          actual-data-nodes: ds$->{1..2}.user_behavior_rebate_order_00$->{0..3}
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
          table-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
        # 注意：以下两张表必须保留，否则会落到默认库 ds0（big_market）而该库无此表，
        # 积分查询/调整接口会直接抛 "Table 'big_market.user_credit_account' doesn't exist"。
        # 修改时请与 sharding-tables.yml（dev 共用）保持一致。
        user_credit_account:
          actual-data-nodes: ds$->{1..2}.user_credit_account
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
        user_credit_order:
          actual-data-nodes: ds$->{1..2}.user_credit_order_00$->{0..3}
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
          table-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
        user_raffle_order:
          actual-data-nodes: ds$->{1..2}.user_raffle_order_00$->{0..3}
          database-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
          table-strategy:
            standard:
              sharding-column: user_id
              precise-algorithm-class-name: cn.qijiv.infrastructure.db.UserIdShardingAlgorithm
    props:
      sql:
        show: false

redis:
  address: ${TEST_REDIS_ADDRESS:redis://127.0.0.1:1}
  username: ${TEST_REDIS_USERNAME:test}
  password: ${TEST_REDIS_PASSWORD:test}
  database: ${REDIS_DATABASE:0}
  connection-pool-size: ${REDIS_CONNECTION_POOL_SIZE:16}
  connection-minimum-idle-size: ${REDIS_CONNECTION_MINIMUM_IDLE_SIZE:2}
  connect-timeout: ${REDIS_CONNECT_TIMEOUT:30000}
  timeout: ${REDIS_TIMEOUT:10000}

mybatis:
  mapper-locations: classpath:/mybatis/mapper/mysql/*.xml
  config-location: classpath:/mybatis/config/mybatis-config.xml

# 测试配置绝不默认连接外部调度中心；集成测试必须显式提供 TEST_* 地址。
xxl:
  job:
    admin:
      addresses: ${TEST_XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:1/xxl-job-admin}
    # 需与 xxl-job-admin 服务端 accessToken 保持一致
    accessToken: ${TEST_XXL_JOB_ACCESS_TOKEN:test-only-token}
    executor:
      appname: ${XXL_JOB_EXECUTOR_APPNAME:big-market-job}
      # 留空则自动获取，多网卡时可指定
      address: ${XXL_JOB_EXECUTOR_ADDRESS:}
      ip: ${XXL_JOB_EXECUTOR_IP:}
      port: ${XXL_JOB_EXECUTOR_PORT:9999}
      logpath: ${XXL_JOB_EXECUTOR_LOGPATH:./data/applogs/xxl-job/jobhandler}
      logretentiondays: ${XXL_JOB_EXECUTOR_LOGRETENTIONDAYS:30}

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml
